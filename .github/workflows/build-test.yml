name: Build and Test

on:
    workflow_dispatch:
        inputs:
          logLevel:
            default: warning
            description: "Log level"
            required: true
          tags:
            description: "Test scenario tags"
          test-filter:
            description: "Surefire -Dtest selector (empty = full suite)"
            required: false
            default: ""

concurrency:
  # older builds for the same pull request numer or branch should be cancelled
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v1
            - uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: '11'
            - name: Build
              shell: bash
              env:
                WHITESOURCE_API_KEY: ${{ secrets.WHITESOURCE_API_KEY }}
                MAVEN_ARGS: -Denforcer.skip=true
              run: |
                if [ -n "${{ inputs.test-filter }}" ]; then
                  mvn clean install --batch-mode --show-version -Dtest="${{ inputs.test-filter }}" -Dsurefire.failIfNoSpecifiedTests=false
                else
                  ./ci/build.sh
                fi
            - name: Report skipped tests with reasons
              if: always()
              shell: bash
              run: |
                python3 - <<'PY'
                import glob, re, xml.etree.ElementTree as ET
                total = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
                for f in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
                    r = ET.parse(f).getroot()
                    for k in total:
                        total[k] += int(r.get(k, 0))
                    for tc in r.iter("testcase"):
                        sk = tc.find("skipped")
                        if sk is None:
                            continue
                        cls = tc.get("classname", "")
                        msg = sk.get("message") or (sk.text or "").strip()
                        print(f"SKIPPED: {cls}#{tc.get('name')} message={msg!r}")
                        src = "src/test/java/" + cls.replace(".", "/") + ".java"
                        try:
                            lines = open(src).read().splitlines()
                        except OSError:
                            continue
                        for i, line in enumerate(lines):
                            if "@Ignore" in line or "assumeTrue" in line or "assumeFalse" in line:
                                print(f"    {src}:{i+1}: {line.strip()}")
                print(f"SUREFIRE TOTAL: tests={total['tests']} failures={total['failures']} errors={total['errors']} skipped={total['skipped']} passed={total['tests']-total['failures']-total['errors']-total['skipped']}")
                PY
            - name: Stage release jars
              shell: bash
              run: |
                V=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
                mkdir -p seal-artifacts
                cp lib/snowflake-jdbc-$V.jar seal-artifacts/
                cp target/snowflake-jdbc-tests.jar seal-artifacts/snowflake-jdbc-$V-tests.jar
                ls -l seal-artifacts
            - uses: actions/upload-artifact@v4
              with:
                name: snowflake-jdbc-jars
                path: seal-artifacts/*.jar
                if-no-files-found: error

    test-linux:
        needs: build
        if: false
        timeout-minutes: 45
        name: ${{ matrix.cloud }} JDBC${{ matrix.additionalMavenProfile }} ${{ matrix.category }} on ${{ matrix.image }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                image: [ 'jdbc-centos7-openjdk8', 'jdbc-centos7-openjdk11', 'jdbc-centos7-openjdk17' ]
                cloud: [ 'AWS' ]
                category: ['TestCategoryResultSet,TestCategoryOthers,TestCategoryLoader', 'TestCategoryConnection,TestCategoryStatement', 'TestCategoryArrow,TestCategoryCore', 'TestCategoryFips']
                additionalMavenProfile: ['', '-Dthin-jar']
        steps:
            - uses: actions/checkout@v1
            - name: Tests
              shell: bash
              env:
                PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
                CLOUD_PROVIDER: ${{ matrix.cloud }}
                TARGET_DOCKER_TEST_IMAGE: ${{ matrix.image }}
                JDBC_TEST_CATEGORY: ${{ matrix.category }}
                ADDITIONAL_MAVEN_PROFILE: ${{ matrix.additionalMavenProfile }}
              run: ./ci/test.sh

    test-linux-old-driver:
        if: false
        timeout-minutes: 45
        name: Old JDBC ${{ matrix.category }} on ${{ matrix.image }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                image: [ 'jdbc-centos7-openjdk8' ]
                cloud: [ 'AWS' ]
                category: ['TestCategoryResultSet,TestCategoryOthers', 'TestCategoryConnection,TestCategoryStatement', 'TestCategoryCore,TestCategoryLoader']
                is_old_driver: ['true']
        steps:
            - uses: actions/checkout@v1
            - name: Tests
              shell: bash
              env:
                PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
                CLOUD_PROVIDER: ${{ matrix.cloud }}
                TARGET_DOCKER_TEST_IMAGE: ${{ matrix.image }}
                JDBC_TEST_CATEGORY: ${{ matrix.category }}
                is_old_driver: ${{ matrix.is_old_driver }}
              run: ./ci/test.sh
